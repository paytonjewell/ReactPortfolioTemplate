apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cluster-issuer-letsencrypt-prod
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite axolotlite.com/fady https://fady.axolotlite.com permanent;
    nginx.ingress.kubernetes.io/rewrite-target: /
  name: fady-portfolio-ingress
spec:
  ingressClassName: external-nginx
  rules:
  - host: fady.axolotlite.com
    http:
      paths:
      - backend:
          service:
            name: portfolio
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - fady.axolotlite.com
    secretName: nginx-tls-axolotlite